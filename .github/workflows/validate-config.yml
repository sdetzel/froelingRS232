name: Validate HA config

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          import yaml
          with open('configuration.yaml', 'r', encoding='utf-8') as f:
              yaml.safe_load(f)
          print('YAML syntax OK')
          PY
